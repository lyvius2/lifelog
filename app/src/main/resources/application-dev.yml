spring:
  # live 프로파일과 같은 환경변수를 쓰되, 로컬 개발이 기본이라 기본값을 localhost 로 둡니다.
  # 컨테이너로 띄운 MySQL 에는 TLS 가 없으므로 sslMode 는 DISABLED 이고,
  # MySQL 8 의 caching_sha2_password 가 공개키를 요구하기 때문에
  # allowPublicKeyRetrieval 도 켭니다 (로컬 전용. live 의 기본값은 false 입니다).
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lifelog}?sslMode=${MYSQL_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul
    username: ${MYSQL_USERNAME:lifelog_app}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: false
  data:
    mongodb:
      auto-index-creation: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.jooq.tools.LoggerListener: DEBUG
