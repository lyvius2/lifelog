server:
  forward-headers-strategy: native

spring:
  devtools:
    restart:
      enabled: false
  # MySQL 접속 정보는 전부 환경변수로 주입합니다. 기본값이 없는 항목(MYSQL_HOST,
  # MYSQL_USERNAME, MYSQL_PASSWORD)이 비면 기동 단계에서 바로 실패합니다.
  #
  # sslMode 가 정식 속성명입니다. 과거 이 URL 은 ssl-mode 로 적혀 있었는데, 드라이버는
  # 모르는 연결 속성을 예외 없이 무시하므로 실제로는 기본값 PREFERRED(기회주의적 TLS,
  # 평문 폴백 허용)로 동작하고 있었습니다.
  #
  # 컨테이너 안의 MySQL 처럼 TLS 가 없는 상대에는 MYSQL_SSL_MODE=DISABLED 를 줍니다.
  # 그 경우 MySQL 8 의 기본 인증 방식(caching_sha2_password)이 서버 공개키를 요구해
  # "Public Key Retrieval is not allowed" 로 접속이 거부되므로
  # MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL=true 도 함께 줘야 합니다.
  # 평문 구간에서 공개키를 받아오는 것은 중간자 공격에 노출되므로 기본값은 false 이고,
  # 신뢰된 네트워크(도커 내부망·로컬)에서만 켜십시오.
  #
  # URL 전체를 직접 지정해야 하면 SPRING_DATASOURCE_URL 환경변수가 아래 값을 덮어씁니다.
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lifelog}?sslMode=${MYSQL_SSL_MODE:REQUIRED}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: false
  data:
    mongodb:
      auto-index-creation: true
    redis:
      ssl:
        enabled: true
      url: ENC(kn1sVpDdQFXlxdV3EPeiovoI5FVPxl/FiAaJu/23CHr5JZ2hbRhAvl0rS6SSvFWPJ/9hXH6g+lmjJ/cC24ErAYiUPxR5zVe2TEXoZAYsUgW/AJ/RdagibQ8aUqgKc4eQDb/EZ5vGvZc=)
      timeout: 2m
      connect-timeout: 10s
      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-idle: 10
          min-idle: 2
          time-between-eviction-runs: 30s
  mongodb:
    uri: ENC(oX46Cs3JsnnonBdNyJCAs2Z4ncCnYZMJena1oELToD90DGOoYCfIXNBwG1+k5e1tXHEiH4ckDxqJzXKBe/tIycpfPJtaITwsj2hq8jP78Nb4yUKqpqb7HBHegBuz/CZTeuWoCbttwBT561zNp98mFw==)
    #uri: mongodb://walter:1234@localhost:27017/lifelog?authSource=admin
  thymeleaf:
    cache: true

management:
  tracing:
    export:
      enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # 기본 호스트는 LOKI_URL 에서 뽑습니다 (trace 와 로그는 같은 관측 스택으로
          # 보내는 것이 보통이므로 호스트를 두 번 지정하지 않게 했습니다).
          # ObservabilityHostEnvironmentPostProcessor 가 이 속성을 채웁니다.
          #   LOKI_URL=http://observe.example:3100/loki/api/v1/push
          #     -> http://observe.example:4318/v1/traces
          # LOKI_URL 이 없으면 localhost 입니다. 엔드포인트를 통째로 다르게 주려면
          # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT 를 지정하십시오.
          endpoint: http://${lifelog.observability.host}:4318/v1/traces

websocket:
  allowed-origins:
    - https://furaiki-lifelog.com
    - https://www.furaiki-lifelog.com

logging:
  level:
    root: INFO
    com.walter.lifelog: INFO
    io.lettuce.core.protocol.ConnectionWatchdog: WARN
    io.lettuce.core.protocol.ReconnectionHandler: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.springframework: WARN
