spring:
  application:
    name: lifelog
  ai:
    openai:
      api-key: # 환경변수로 설정 ${SPRING_AI_OPENAI_API_KEY:}
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  # JPA 를 쓰지 않습니다. 매핑은 jOOQ 가 직접 하고, 스키마는 schema.sql 이 만듭니다.
  sql:
    init:
      mode: embedded
  data:
    mongodb:
      auto-index-creation: true
  main:
    allow-bean-definition-overriding: true
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    check-template-location: true
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

server:
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  health:
    mongodb:
      enabled: false
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

websocket:
  allowed-origins:
    - http://localhost:8080

photo:
  upload-dir: lifelog/pictures

