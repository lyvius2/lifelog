<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me — 風雨来記</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500&amp;family=Noto+Sans+KR:wght@300;400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>
    <!-- ── Navigation ── -->
    <nav>
        <a href="/index" class="nav-logo">風雨来記<span>.</span></a>
        <ul class="nav-links">
            <li><a href="/about" class="active"><span class="nav-icon">👤</span> About Me</a></li>
            <li><a href="/index"><span class="nav-icon">📝</span> Blog</a></li>
            <li><a href="/photos"><span class="nav-icon">📷</span> Photos</a></li>
            <li><a href="/my-car"><span class="nav-icon">🚗</span> My Car</a></li>
            <li><a href="#"><span class="nav-icon">📊</span> Monitoring</a></li>
        </ul>
    </nav>

    <!-- ── Hero ── -->
    <div class="about-hero">
        <div class="about-hero-bg"></div>
        <div class="about-hero-content">
            <p class="hero-eyebrow">
                <th:block th:each="job, iterStat : ${content.job}">
                    <span th:text="${job}"></span><span th:if="${!iterStat.last}"> · </span>
                </th:block>
            </p>
            <h1 class="hero-name">
                <span th:utext="${content.title}"></span>
                <em th:text="${content.subTitle}"></em>
            </h1>
            <p class="hero-tagline" th:text="${content.comment}"></p>
        </div>
    </div>

    <!-- ── Main Content ── -->
    <div class="about-wrap">
        <!-- ── Sidebar ── -->
        <aside class="sidebar">
            <div class="profile-card">
                <div class="profile-img-wrap">
                    <img th:src="${content.image}" alt="walter" />
                </div>
                <!-- 사진 미등록 시 표시되는 플레이스홀더 -->
                <!--
                <div class="profile-avatar-placeholder">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span>Photo here</span>
                </div>
                -->
                <div class="profile-info">
                    <div class="profile-handle" th:text="${content.email}"></div>
                    <p class="profile-bio" th:text="${content.profile}"></p>
                </div>
            </div>
            <div class="sidebar-links">
                <th:block th:each="etc : ${content.resume.etc}">
                    <a th:if="${etc.url != null}" th:href="${etc.url}" target="_blank" class="sidebar-link">
                        <span class="sidebar-link-icon" th:utext="${etc.icon}">️</span>
                        <span class="sidebar-link-label" th:text="${etc.title}"></span>
                        <span class="sidebar-link-url" th:text="${etc.description}"></span>
                    </a>
                </th:block>
            </div>
            <div class="badge-row">
                <th:block th:each="tag : ${content.tags}">
                    <span class="badge" th:text="${tag}"></span>
                </th:block>
            </div>
        </aside>

        <!-- ── Main ── -->
        <main class="about-main">
            <!-- Intro -->
            <div class="section" id="sec-intro">
                <div class="section-heading">
                    <div class="section-heading-icon">🙋</div>
                    <h2>Intro</h2>
                    <span class="section-heading-tag">About</span>
                </div>
                <p class="intro-text" th:utext="${content.resume.intro}">
                </p>
            </div>
            <!-- Work Experience -->
            <div class="section" id="sec-work">
                <div class="section-heading">
                    <div class="section-heading-icon">💼</div>
                    <h2>Work Experience</h2>
                    <span class="section-heading-tag">Career</span>
                </div>
                <div class="timeline">
                    <div class="timeline-item" th:each="exp : ${content.resume.workExperience}">
                        <div class="timeline-dot"></div>
                        <div class="timeline-header">
                            <span class="timeline-company" th:text="${exp.company}"></span>
                            <span class="timeline-role" th:text="${exp.role}"></span>
                            <span class="timeline-period">
                                <span th:text="${exp.startDate}"></span> –
                                <span th:if="${exp.endDate != null}" th:text="${exp.endDate}"></span>
                                <span th:if="${exp.endDate == null}">현재</span>
                            </span>
                        </div>
                        <ul class="timeline-tasks">
                            <li th:each="w : ${exp.work}" th:text="${w}"></li>
                        </ul>
                    </div>
                </div><!-- /timeline -->
            </div>
            <!-- Technical Skills -->
            <div class="section" id="sec-skills">
                <div class="section-heading">
                    <div class="section-heading-icon">⚙️</div>
                    <h2>Technical Skills</h2>
                    <span class="section-heading-tag">Stack</span>
                </div>
                <div class="skills-grid">
                    <th:block th:each="skill, iterStat : ${content.resume.skills}">
                        <div class="skill-row">
                            <span class="skill-category" th:text="${skill.category}"></span>
                            <div class="skill-tags">
                                <span th:each="item, itemStat : ${skill.items}"
                                      class="skill-tag"
                                      th:classappend="${itemStat.index == 0 or itemStat.index == 1} ? 'primary' : ''"
                                      th:text="${item}"></span>
                            </div>
                        </div>
                        <div class="skills-divider" th:if="${!iterStat.last}"></div>
                    </th:block>
                </div>
            </div>
            <!-- Patents -->
            <div class="section" id="sec-patents">
                <div class="section-heading">
                    <div class="section-heading-icon">📜</div>
                    <h2>Patents</h2>
                    <span class="section-heading-tag">출원 · 등록</span>
                </div>
                <div class="patent-list">
                    <th:block th:each="patent : ${content.resume.patents}">
                        <div class="patent-card">
                            <div class="patent-number-badge" th:text="${patent.no}"></div>
                            <div class="patent-header">
                                <span class="patent-title" th:text="${patent.title}"></span>
                                <span class="patent-status" th:classappend="${patent.status}">
                                    <span th:switch="${patent.status}">
                                        <span th:case="'filed'">출원중</span>
                                        <span th:case="'registered'">등록완료</span>
                                        <span th:case="'pending'">심사중</span>
                                        <span th:case="*">상태 미지정</span>
                                    </span>
                                </span>
                            </div>
                            <div class="patent-meta">
                                <span class="patent-meta-item">
                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    출원일 : <span th:text="${patent.date}"></span>
                                </span>
                                <span class="patent-meta-item">
                                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                                    출원번호 : <span th:text="${patent.uniqueNumber}"></span>
                                </span>
                            </div>
                            <p class="patent-desc" th:text="${patent.description}"></p>
                        </div>
                    </th:block>
                </div><!-- /patent-list -->
            </div>
            <!-- ETC -->
            <div class="section" id="sec-etc">
                <div class="section-heading">
                    <div class="section-heading-icon">🌟</div>
                    <h2>ETC</h2>
                    <span class="section-heading-tag">Extra</span>
                </div>
                <div class="etc-list">
                    <th:block th:each="etc : ${content.resume.etc}">
                        <a th:if="${etc.url != null}" th:href="${etc.url}" target="_blank" class="etc-item">
                            <span class="etc-item-icon" th:utext="${etc.icon}"></span>
                            <div class="etc-item-body">
                                <div class="etc-item-title" th:text="${etc.title}"></div>
                                <div class="etc-item-desc" th:text="${etc.description}"></div>
                            </div>
                            <span class="etc-item-arrow">→</span>
                        </a>
                        <div th:if="${etc.url == null}" class="etc-item">
                            <span class="etc-item-icon" th:utext="${etc.icon}"></span>
                            <div class="etc-item-body">
                                <div class="etc-item-title" th:text="${etc.title}"></div>
                                <div class="etc-item-desc" th:text="${etc.description}"></div>
                            </div>
                        </div>
                    </th:block>
                </div>
            </div>
        </main>
    </div><!-- /about-wrap -->

    <!-- ── Footer ── -->
    <footer>
        <span class="footer-logo">Lifelog</span>
        <p>&copy; 2026 · All rights reserved · Made with <a href="https://spring.io/projects/spring-boot">Spring Boot</a></p>
    </footer>

    <script>
        // Scroll-triggered fade-in for sections
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
            }, { threshold: 0.08 });
        document.querySelectorAll('.section').forEach(el => observer.observe(el));
    </script>
</body>
</html>
