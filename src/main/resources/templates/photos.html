  // ═══════════════════════════════════════════════════════════
  // Gallery Rendering
  // ═══════════════════════════════════════════════════════════
  const grid = document.getElementById('galleryGrid');
  let currentFilter = 'all';
  let isMasonry = false;
  let currentIndex = 0;
  let filteredPhotos = [...photos];

  function getDisplayPhotos() {
    return currentFilter === 'all'
      ? photos
      : photos.filter(p => p.category === currentFilter);
  }

  function renderGallery() {
    filteredPhotos = getDisplayPhotos();
    grid.innerHTML = '';

    filteredPhotos.forEach((photo, idx) => {
      const card = document.createElement('div');
      card.className = 'photo-card' + (isMasonry && photo.size ? ' ' + photo.size : '');
      card.dataset.index = idx;

      card.innerHTML = `
        <img
          src="${photo.thumb}"
          alt="${photo.title}"
          loading="lazy"
        />
        <div class="photo-overlay">
          <div class="overlay-stats">
            <div class="overlay-stat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1.5">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              ${photo.likes.toLocaleString()}
            </div>
            <div class="overlay-stat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              ${photo.comments}
            </div>
          </div>
          <div class="overlay-tag">${photo.tags[0]}</div>
        </div>
      `;

      card.addEventListener('click', () => openLightbox(idx));
      // Stagger entrance
      card.style.opacity = '0';
      card.style.transform = 'scale(0.96)';
      card.style.transition = `opacity 0.4s ${idx * 45}ms, transform 0.4s ${idx * 45}ms`;
      grid.appendChild(card);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.style.opacity = '1';
          card.style.transform = 'scale(1)';
        });
      });
    });
  }

  // ═══════════════════════════════════════════════════════════
  // Lightbox
  // ═══════════════════════════════════════════════════════════
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lbImg');
  const lbTitle  = document.getElementById('lbTitle');
  const lbText   = document.getElementById('lbText');
  const lbTags   = document.getElementById('lbTags');
  const lbDate   = document.getElementById('lbDate');
  const lbLikeCount    = document.getElementById('lbLikeCount');
  const lbCommentCount = document.getElementById('lbCommentCount');
  const lbLike   = document.getElementById('lbLike');

  function openLightbox(idx) {
    currentIndex = idx;
    populateLightbox(filteredPhotos[idx]);
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function populateLightbox(photo) {
    lbImg.src = photo.src;
    lbImg.alt = photo.title;
    lbTitle.textContent = photo.title;
    lbText.textContent = photo.caption;
    lbDate.textContent = photo.date;
    lbLikeCount.textContent = photo.likes.toLocaleString();
    lbCommentCount.textContent = photo.comments;
    lbTags.innerHTML = photo.tags.map(t =>
      `<span class="lb-tag">${t}</span>`
    ).join(' ');
    lbLike.classList.remove('liked');

    // ── EXIF populate ──
    const e = photo.exif || {};
    document.getElementById('exifModel').textContent    = e.model     || '—';
    document.getElementById('exifMaker').textContent    = e.maker     || '—';
    document.getElementById('exifAperture').textContent = e.aperture  || '—';
    document.getElementById('exifShutter').textContent  = e.shutter   || '—';
    document.getElementById('exifIso').textContent      = e.iso ? 'ISO ' + e.iso : '—';
    document.getElementById('exifFocal').textContent    = e.focal     || '—';
    document.getElementById('exifLens').textContent     = e.lens      || '—';
  }

  function navigate(dir) {
    currentIndex = (currentIndex + dir + filteredPhotos.length) % filteredPhotos.length;
    lbImg.style.opacity = '0';
    setTimeout(() => {
      populateLightbox(filteredPhotos[currentIndex]);
      lbImg.style.opacity = '1';
    }, 150);
    lbImg.style.transition = 'opacity 0.15s';
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbBackdrop').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => navigate(-1));
  document.getElementById('lbNext').addEventListener('click', () => navigate(1));

  // EXIF toggle collapse/expand
  document.getElementById('lbExifToggle').addEventListener('click', () => {
    document.getElementById('lbExif').classList.toggle('collapsed');
  });

  lbLike.addEventListener('click', () => {
    lbLike.classList.toggle('liked');
    const p = filteredPhotos[currentIndex];
    p.likes += lbLike.classList.contains('liked') ? 1 : -1;
    lbLikeCount.textContent = p.likes.toLocaleString();
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  // ═══════════════════════════════════════════════════════════
  // Filter Tabs
  // ═══════════════════════════════════════════════════════════
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderGallery();
    });
  });

  // ═══════════════════════════════════════════════════════════
  // View Toggle
  // ═══════════════════════════════════════════════════════════
  document.getElementById('btnGrid').addEventListener('click', () => {
    isMasonry = false;
    grid.classList.remove('masonry');
    document.getElementById('btnGrid').classList.add('active');
    document.getElementById('btnMasonry').classList.remove('active');
    renderGallery();
  });
  document.getElementById('btnMasonry').addEventListener('click', () => {
    isMasonry = true;
    grid.classList.add('masonry');
    document.getElementById('btnMasonry').classList.add('active');
    document.getElementById('btnGrid').classList.remove('active');
    renderGallery();
  });

  // ═══════════════════════════════════════════════════════════
  // Init
  // ═══════════════════════════════════════════════════════════
  renderGallery();

  // Load More (placeholder)
  document.getElementById('loadMoreBtn').addEventListener('click', function () {
    this.textContent = 'All photos loaded';
    this.style.opacity = '0.4';
    this.disabled = true;
  });
  </script>
</body>
</html>
