<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <title>Access Denied — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>

<th:block th:replace="~{fragments/navigation :: nav}"></th:block>

<div style="flex:1">
    <div class="access-denied-wrap">
        <div class="access-denied-icon">🔒</div>
        <div class="access-denied-title">관리자만 접근 가능합니다.</div>
        <div class="access-denied-message">이 페이지는 관리자 로그인이 필요합니다.</div>
        <div class="access-denied-timer">
            <span id="countdown" class="countdown">10</span><span>초 후 기본 화면으로 이동합니다.</span>
        </div>
        <a href="/" class="access-denied-link">지금 바로 이동</a>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/modals :: modals}"></th:block>

    <script>
        (function () {
            let seconds = 10;
            const el = document.getElementById('countdown');
            const timer = setInterval(function () {
                seconds--;
                el.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    location.href = '/';
                }
            }, 1000);
        })();
    </script>

<th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>

</body>
</html>
