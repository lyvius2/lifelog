<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <title>비밀번호 변경 — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
    <link rel="stylesheet" href="/css/account.css" />
</head>
<body>

<th:block th:replace="~{fragments/navigation :: nav}"></th:block>

<div style="flex:1">
    <div class="account-page">
        <div class="account-card">
            <div class="account-title">비밀번호 변경</div>
            <div class="account-desc">현재 비밀번호를 확인한 뒤 새 비밀번호로 변경합니다.</div>

            <div class="login-field">
                <label for="current-password">현재 비밀번호</label>
                <input type="password" id="current-password" class="login-input"
                       placeholder="현재 비밀번호" autocomplete="current-password" />
            </div>
            <div class="login-field">
                <label for="new-password">새 비밀번호</label>
                <input type="password" id="new-password" class="login-input"
                       placeholder="8자 이상" autocomplete="new-password" />
            </div>
            <div class="login-field">
                <label for="new-password-confirm">새 비밀번호 확인</label>
                <input type="password" id="new-password-confirm" class="login-input"
                       placeholder="새 비밀번호를 다시 입력" autocomplete="new-password" />
            </div>

            <div class="login-error" id="password-error"></div>
            <div class="account-success" id="password-success"></div>

            <button class="login-btn" id="password-submit" onclick="changePassword()">변경하기</button>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/modals :: modals}"></th:block>
<th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>

<script src="/js/account-password.js"></script>

</body>
</html>
