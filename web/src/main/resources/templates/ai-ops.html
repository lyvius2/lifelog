<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Spring AI Ops — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
    <link rel="stylesheet" href="/css/ai-ops.css" />
</head>
<body>

<div layout:fragment="content" class="aiops-content">

    <!-- ── Header Bar ── -->
    <div class="aiops-header">
        <div class="aiops-header-inner">
            <p class="aiops-desc"><strong class="aiops-highlight">Spring AI Ops</strong> — LLM으로 장애를 분석하고 코드를 리뷰하는 Spring AI 기반 운영 자동화 도구입니다.</p>
            <div class="aiops-actions">
                <a href="https://github.com/lyvius2/spring-ai-ops" class="btn btn-primary" target="_blank">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    <span>GitHub</span>
                </a>
                <a href="#" id="archToggleBtn" class="btn btn-ghost" onclick="toggleArchView(event)">
                    <svg id="archIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                    </svg>
                    <span id="archToggleLabel">Architecture</span>
                </a>
                <a href="https://ai-ops.duckdns.org" class="btn btn-ghost" target="_blank">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
                    </svg>
                    <span>Live Site</span>
                </a>
            </div>
        </div>
    </div>

    <!-- ── iframe ── -->
    <iframe id="aiopsFrame"
            class="aiops-frame"
            src="https://ai-ops.duckdns.org"
            allow="fullscreen"
            loading="lazy"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
    </iframe>

    <script>
        var LIVE_URL = 'https://ai-ops.duckdns.org';
        var ARCH_URL = '/ai-ops/design';
        var isArchView = false;

        function toggleArchView(e) {
            e.preventDefault();
            var frame = document.getElementById('aiopsFrame');
            var label = document.getElementById('archToggleLabel');
            var icon = document.getElementById('archIcon');

            if (!isArchView) {
                frame.src = ARCH_URL;
                label.textContent = 'Rollback';
                icon.innerHTML = '<polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>';
            } else {
                frame.src = LIVE_URL;
                label.textContent = 'Architecture';
                icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>';
            }
            isArchView = !isArchView;
        }
    </script>

</div>

</body>
</html>
