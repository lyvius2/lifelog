<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Content Editor — Lifelog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/content-editor.css" />
  <link rel="stylesheet" href="/webjars/codemirror/5.62.2/lib/codemirror.css" />
  <link rel="stylesheet" href="/webjars/codemirror/5.62.2/theme/dracula.css" />
  <style>
    .ce-json-wrap .CodeMirror {
      height: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      border-radius: 0;
    }
    .ce-json-wrap .CodeMirror-scroll { min-height: 100%; }
    .ce-json-wrap .CodeMirror-gutters { border-right: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body>

  <!-- ═══ TOP BAR ═══ -->
  <div class="topbar">
    <a href="/index" class="topbar-logo">風雨来記<span>.</span></a>
    <div class="topbar-sep"></div>
    <div class="topbar-breadcrumb">Content / <span>Editor</span></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-status" id="topbarStatus"></div>
  </div>

  <!-- ═══ MAIN SHELL ═══ -->
  <div class="ce-shell">

    <!-- ── Left: Type Panel ── -->
    <aside class="ce-type-panel">
      <div class="ce-type-panel-header">
        <span class="ce-type-panel-title">Content Types</span>
        <button class="ce-new-btn" id="ceNewBtn" onclick="openNewMode()" title="새 Content 생성">+</button>
      </div>
      <ul class="ce-type-list" id="ceTypeList">
        <!-- JS로 렌더링 -->
      </ul>
    </aside>

    <!-- ── Right: Editor Panel ── -->
    <div class="ce-editor-panel">

      <!-- Empty State -->
      <div class="ce-empty" id="ceEmpty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <p>좌측에서 Content Type을 선택하세요.</p>
      </div>

      <!-- Editor Main -->
      <div class="ce-editor-main" id="ceEditorMain" style="display:none;">

        <!-- Toolbar -->
        <div class="ce-editor-toolbar">
          <div class="ce-editor-type-info">
            <span class="ce-editor-type-badge" id="ceTypeBadge"></span>
            <!-- 신규 모드: ContentType 선택 셀렉트 -->
            <select class="ce-type-select" id="ceTypeSelect" style="display:none;" onchange="onNewTypeChange()">
              <!-- JS로 렌더링 -->
            </select>
            <span class="ce-editor-type-desc" id="ceTypeDesc"></span>
          </div>
          <div class="ce-editor-actions">
            <button class="btn btn-ghost" onclick="formatJson()">Format</button>
            <button class="btn btn-ghost" id="ceResetBtn" onclick="resetEditor()">Reset</button>
            <button class="btn btn-primary" id="ceSaveBtn" onclick="saveContent()">Save</button>
          </div>
        </div>

        <!-- JSON Editor -->
        <div class="ce-json-wrap">
          <textarea class="ce-json-editor" id="ceJsonEditor"
                    spellcheck="false"
                    placeholder='{"key": "value"}'></textarea>
        </div>

        <!-- Status Bar -->
        <div class="ce-status-bar">
          <span class="ce-status-msg info" id="ceStatus">편집 준비 완료</span>
        </div>

      </div><!-- /ce-editor-main -->
    </div><!-- /ce-editor-panel -->

  </div><!-- /ce-shell -->

  <!-- ═══ SAVE SUCCESS MODAL ═══ -->
  <div class="ce-modal-overlay" id="ceModalOverlay" onclick="handleOverlayClick(event)">
    <div class="ce-modal" id="ceModal">
      <div class="ce-modal-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="9 12 11.5 14.5 15.5 10"/>
        </svg>
      </div>
      <span class="ce-modal-msg">저장되었습니다.</span>
      <button class="btn btn-ghost ce-modal-close" onclick="hideModal()">확인</button>
    </div>
  </div>

<script src="/webjars/codemirror/5.62.2/lib/codemirror.js"></script>
<script src="/webjars/codemirror/5.62.2/mode/javascript/javascript.js"></script>

<script th:inline="none">
  let _types    = [];
  let _current  = null;  // 편집 모드: 현재 선택된 타입
  let _original = '';
  let _isNew    = false; // 신규 생성 모드 여부
  let cmEditor  = null;

  document.addEventListener('DOMContentLoaded', () => {
    loadTypes();

    cmEditor = CodeMirror.fromTextArea(document.getElementById('ceJsonEditor'), {
      mode: { name: 'javascript', json: true },
      theme: 'dracula',
      lineNumbers: true,
      tabSize: 2,
      indentWithTabs: false,
      lineWrapping: false,
      extraKeys: {
        'Tab': cm => cm.replaceSelection('  '),
      },
    });

    // 편집 시작 시 에러 라인 하이라이트 해제
    cmEditor.on('change', () => clearErrorLine());
  });

  /* ─── 타입 목록 로드 ─── */
  function loadTypes() {
    return fetch('/api/content/types')
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          _types = result.data;
          renderTypeList(_types.filter(t => t.hasDocument));
          updateNewBtn();
        } else {
          showStatus('타입 목록을 불러오지 못했습니다.', 'error');
        }
      })
      .catch(() => showStatus('서버와 통신할 수 없습니다.', 'error'));
  }

  function updateNewBtn() {
    const noDocTypes = _types.filter(t => !t.hasDocument);
    document.getElementById('ceNewBtn').style.display = noDocTypes.length > 0 ? '' : 'none';
  }

  /* ─── 좌측 목록 렌더링 (hasDocument인 타입만) ─── */
  function renderTypeList(types) {
    const list = document.getElementById('ceTypeList');
    if (types.length === 0) {
      list.innerHTML = '<li class="ce-type-empty">등록된 Content가 없습니다.</li>';
      return;
    }
    list.innerHTML = types.map(t => `
      <li class="ce-type-item" id="type-item-${t.contentType}" onclick="selectType('${t.contentType}')">
        <div class="ce-type-info">
          <span class="ce-type-name">${escapeHtml(t.contentType)}</span>
          <span class="ce-type-desc">${escapeHtml(t.typeDescription)}</span>
        </div>
      </li>
    `).join('');
  }

  /* ─── 편집: 기존 타입 선택 ─── */
  function selectType(contentType) {
    _current = _types.find(t => t.contentType === contentType);
    if (!_current) return;

    document.querySelectorAll('.ce-type-item').forEach(el => el.classList.remove('active'));
    const item = document.getElementById('type-item-' + contentType);
    if (item) item.classList.add('active');

    loadDocument(contentType);
  }

  function loadDocument(contentType) {
    showStatus('불러오는 중...', 'info');
    fetch('/api/content?contentType=' + encodeURIComponent(contentType))
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          openEditMode(result.data);
        } else {
          showStatus('문서를 불러오지 못했습니다.', 'error');
        }
      })
      .catch(() => showStatus('서버와 통신할 수 없습니다.', 'error'));
  }

  function openEditMode(doc) {
    _isNew = false;
    const json = JSON.stringify(doc.content, null, 2);
    _original = json;

    document.getElementById('ceTypeBadge').textContent  = doc.contentType;
    document.getElementById('ceTypeBadge').className    = 'ce-editor-type-badge';
    document.getElementById('ceTypeBadge').style.display = '';
    document.getElementById('ceTypeSelect').style.display = 'none';
    document.getElementById('ceTypeDesc').textContent   = doc.typeDescription;
    document.getElementById('ceResetBtn').style.display = '';
    cmEditor.setValue(json);

    document.getElementById('ceEmpty').style.display      = 'none';
    document.getElementById('ceEditorMain').style.display = 'flex';
    setTimeout(() => cmEditor.refresh(), 0);
    showStatus('편집 준비 완료', 'info');
  }

  /* ─── 신규 생성 모드 ─── */
  function openNewMode() {
    const noDocTypes = _types.filter(t => !t.hasDocument);
    if (noDocTypes.length === 0) return;

    _isNew    = true;
    _current  = null;
    _original = '{\n  \n}';

    // 좌측 active 해제
    document.querySelectorAll('.ce-type-item').forEach(el => el.classList.remove('active'));

    // 셀렉트 렌더링
    const select = document.getElementById('ceTypeSelect');
    select.innerHTML = noDocTypes.map(t =>
      `<option value="${escapeHtml(t.contentType)}">${escapeHtml(t.contentType)} — ${escapeHtml(t.typeDescription)}</option>`
    ).join('');

    document.getElementById('ceTypeBadge').textContent   = '+ NEW';
    document.getElementById('ceTypeBadge').className     = 'ce-editor-type-badge ce-badge-new';
    document.getElementById('ceTypeBadge').style.display = '';
    document.getElementById('ceTypeSelect').style.display = '';
    document.getElementById('ceTypeDesc').textContent    = noDocTypes[0].typeDescription;
    document.getElementById('ceResetBtn').style.display  = 'none';
    cmEditor.setValue(_original);

    document.getElementById('ceEmpty').style.display      = 'none';
    document.getElementById('ceEditorMain').style.display = 'flex';
    setTimeout(() => { cmEditor.refresh(); cmEditor.focus(); }, 0);
    showStatus('새 Content를 작성하세요.', 'info');
  }

  function onNewTypeChange() {
    const select = document.getElementById('ceTypeSelect');
    const chosen = _types.find(t => t.contentType === select.value);
    if (chosen) {
      document.getElementById('ceTypeDesc').textContent = chosen.typeDescription;
    }
  }

  /* ─── JSON 조작 ─── */
  function formatJson() {
    const json = cmEditor.getValue();
    try {
      cmEditor.setValue(JSON.stringify(JSON.parse(json), null, 2));
      clearErrorLine();
      showStatus('JSON 형식 정렬 완료', 'info');
    } catch (e) {
      const line = getJsonErrorLine(json, e);
      if (line !== null) {
        highlightErrorLine(line);
        cmEditor.setCursor({ line: line - 1, ch: 0 });
        showStatus(`JSON 형식 오류 — ${line}번째 줄 근처를 확인하세요.`, 'error');
      } else {
        showStatus('JSON 형식 오류 — ' + e.message, 'error');
      }
    }
  }

  function resetEditor() {
    cmEditor.setValue(_original);
    showStatus('초기 내용으로 되돌렸습니다.', 'info');
  }

  /* ─── 저장 ─── */
  function saveContent() {
    const saveBtn = document.getElementById('ceSaveBtn');

    let parsedContent;
    try {
      parsedContent = JSON.parse(cmEditor.getValue());
    } catch (e) {
      showStatus('JSON 파싱 오류: ' + e.message, 'error');
      return;
    }

    const targetType = _isNew
      ? document.getElementById('ceTypeSelect').value
      : (_current ? _current.contentType : null);

    if (!targetType) {
      showStatus('Content Type을 선택하세요.', 'error');
      return;
    }

    saveBtn.disabled = true;
    showStatus('저장 중...', 'info');

    fetch('/api/content', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contentType: targetType, content: parsedContent }),
    })
    .then(res => res.json())
    .then(result => {
      if (result.success) {
        showModal();
        // 타입 목록 갱신 후 저장된 타입을 편집 모드로 전환
        loadTypes().then(() => {
          selectType(targetType);
        });
      } else {
        showStatus('저장 실패: ' + (result.message || ''), 'error');
      }
    })
    .catch(() => showStatus('서버와 통신할 수 없습니다.', 'error'))
    .finally(() => { saveBtn.disabled = false; });
  }

  /* ─── 유틸 ─── */
  function showStatus(msg, type) {
    const el = document.getElementById('ceStatus');
    el.textContent = msg;
    el.className = 'ce-status-msg ' + (type || 'info');
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  /* ─── 저장 완료 모달 ─── */
  let _modalTimer = null;

  function showModal() {
    const overlay = document.getElementById('ceModalOverlay');
    clearTimeout(_modalTimer);
    overlay.style.display = 'flex';
    requestAnimationFrame(() => overlay.classList.add('visible'));
    _modalTimer = setTimeout(hideModal, 2200);
  }

  function hideModal() {
    const overlay = document.getElementById('ceModalOverlay');
    overlay.classList.remove('visible');
    setTimeout(() => { overlay.style.display = 'none'; }, 200);
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('ceModalOverlay')) hideModal();
  }

  /* ─── JSON 에러 라인 파싱 ─── */
  let _errorLineHandle = null;

  function getJsonErrorLine(json, e) {
    // Firefox: "line N column M"
    const ffMatch = e.message.match(/line (\d+)/);
    if (ffMatch) return parseInt(ffMatch[1], 10);

    // Chrome/Edge: "at position N"
    const posMatch = e.message.match(/position (\d+)/);
    if (posMatch) {
      const pos = parseInt(posMatch[1], 10);
      return json.substring(0, pos).split('\n').length;
    }
    return null;
  }

  function highlightErrorLine(line) {
    clearErrorLine();
    _errorLineHandle = cmEditor.addLineClass(line - 1, 'background', 'cm-error-line');
  }

  function clearErrorLine() {
    if (_errorLineHandle !== null) {
      cmEditor.removeLineClass(_errorLineHandle, 'background', 'cm-error-line');
      _errorLineHandle = null;
    }
  }
</script>

</body>
</html>
