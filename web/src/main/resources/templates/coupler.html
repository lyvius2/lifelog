<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Random Coupler — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
    <link rel="stylesheet" href="/css/coupler.css" />
</head>
<body>

<div layout:fragment="content" class="coupler-page">

    <!-- ── Header ── -->
    <div class="coupler-header">
        <div class="coupler-header-inner">
            <div class="coupler-title-wrap">
                    <span class="coupler-badge">Ruby CLI</span>
                    <h1 class="coupler-title">Random Coupler</h1>
                </div>
            <div class="coupler-header-actions">
                <button id="restart-btn" class="coupler-restart-btn" onclick="restartSession()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 .49-4.5"/>
                    </svg>
                    다시 시작
                </button>
                <a href="https://github.com/lyvius2/random-coupler"
                   class="coupler-gh-link" target="_blank" rel="noopener">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    GitHub
                </a>
            </div>
        </div>
    </div>

    <!-- ── Terminal ── -->
    <div class="coupler-terminal-wrap">

        <!-- title bar -->
        <div class="coupler-console-bar">
            <span class="console-dot red"></span>
            <span class="console-dot yellow"></span>
            <span class="console-dot green"></span>
            <span class="console-title">coupler.rb — JRuby</span>
            <span id="console-status" class="console-status"></span>
        </div>

        <!-- stdout output area -->
        <div class="coupler-console" id="console-output"></div>

        <!-- stdin input bar -->
        <div class="coupler-input-bar" id="input-bar">
            <span class="input-prompt">&#36;</span>
            <input type="text" id="console-input"
                   class="console-input-field"
                   placeholder="이름 입력 후 Enter (빈 줄 = 커플링 시작)"
                   autocomplete="off"
                   onkeydown="handleInputKey(event)" />
            <button class="input-send-btn" onclick="sendInput()">↵</button>
        </div>

    </div>

</div>

<th:block layout:fragment="scripts">
<script src="/js/coupler.js"></script>
</th:block>

</body>
</html>
