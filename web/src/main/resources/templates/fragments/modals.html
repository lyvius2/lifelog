<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  모든 페이지에 깔리는 공용 모달입니다 (발행 알림 배너, 관리자 로그인).
  동작 스크립트는 fragments/common-scripts.html 에 있습니다.
-->
<body>
<th:block th:fragment="modals">

<!-- ═══ POST PUBLISHED NOTIFICATION ═══ -->
<a class="post-pub-notif" id="post-pub-notif" href="#" target="_blank">
    <div class="post-pub-notif-bar"></div>
    <div class="post-pub-notif-body">
        <div class="post-pub-notif-msg">블로그에 새로운 글이 발행되었습니다.</div>
        <div class="post-pub-notif-title" id="post-pub-notif-title"></div>
        <div class="post-pub-notif-time" id="post-pub-notif-time"></div>
    </div>
</a>

<!-- ═══ LOGIN MODAL ═══ -->
<div class="login-overlay" id="login-modal">
    <div class="login-modal">
        <div class="login-header">
            <div class="login-title">관리자 로그인</div>
            <button class="login-close" onclick="closeLoginModal()">✕</button>
        </div>
        <div class="login-body">
            <div class="login-field">
                <label for="login-email">이메일</label>
                <input type="email" id="login-email" class="login-input" placeholder="admin@example.com" autocomplete="email" />
            </div>
            <div class="login-field">
                <label for="login-password">비밀번호</label>
                <input type="password" id="login-password" class="login-input" placeholder="비밀번호를 입력하세요" autocomplete="current-password" />
            </div>
            <div class="login-error" id="login-error"></div>
        </div>
        <div class="login-footer">
            <button class="login-btn" onclick="doLogin()">로그인</button>
        </div>
    </div>
</div>

<!-- ═══ PASSWORD CHANGE MODAL ═══ -->
<div class="login-overlay" id="password-modal">
    <div class="login-modal">
        <div class="login-header">
            <div class="login-title">비밀번호 변경</div>
            <button class="login-close" id="password-close" onclick="closePasswordModal()">✕</button>
        </div>

        <div id="password-form-view">
            <div class="login-body">
                <div class="login-field">
                    <label for="current-password">현재 비밀번호</label>
                    <input type="password" id="current-password" class="login-input"
                           placeholder="현재 비밀번호" autocomplete="current-password" />
                </div>
                <div class="login-field">
                    <label for="new-password">새 비밀번호</label>
                    <input type="password" id="new-password" class="login-input"
                           placeholder="8자 이상" autocomplete="new-password" />
                </div>
                <div class="login-field">
                    <label for="new-password-confirm">새 비밀번호 확인</label>
                    <input type="password" id="new-password-confirm" class="login-input"
                           placeholder="새 비밀번호를 다시 입력" autocomplete="new-password" />
                </div>
                <div class="login-error" id="password-error"></div>
            </div>
            <div class="login-footer">
                <button class="login-btn" id="password-submit" onclick="changePassword()">변경하기</button>
            </div>
        </div>

        <div id="password-done-view" style="display:none">
            <div class="login-body">
                <div class="login-message">비밀번호가 변경되었습니다.<br />다시 로그인하세요.</div>
            </div>
            <div class="login-footer">
                <button class="login-btn" onclick="finishPasswordChange()">확인</button>
            </div>
        </div>
    </div>
</div>

<div class="login-overlay" id="static-web-modal">
    <div class="login-modal">
        <div class="login-header">
            <div class="login-title">정적 웹페이지 등록</div>
            <button class="login-close" id="static-web-close" onclick="closeStaticWebModal()">✕</button>
        </div>

        <div id="static-web-form-view">
            <div class="login-body">
                <div class="login-field">
                    <label for="static-web-source">등록 방식</label>
                    <select id="static-web-source" class="login-input" onchange="switchStaticWebSource()">
                        <option value="FILE">실제 파일</option>
                        <option value="URL">Web URL</option>
                    </select>
                </div>
                <div class="login-field" id="static-web-file-field">
                    <label for="static-web-file">HTML 파일</label>
                    <input type="file" id="static-web-file" class="login-input"
                           accept=".html,.htm,text/html" />
                </div>
                <div class="login-field" id="static-web-url-field" style="display:none">
                    <label for="static-web-url">Web URL</label>
                    <input type="url" id="static-web-url" class="login-input"
                           placeholder="https://claude.ai/public/artifacts/..." />
                </div>
                <div class="login-field">
                    <label for="static-web-path">접속 경로</label>
                    <input type="text" id="static-web-path" class="login-input" maxlength="20"
                           placeholder="비워두면 자동 생성" autocomplete="off" />
                    <div class="login-hint">/static/ 뒤에 붙습니다. 영문·숫자·하이픈·언더바 최대 20자</div>
                </div>
                <div class="login-error" id="static-web-error"></div>
            </div>
            <div class="login-footer">
                <button class="login-btn" id="static-web-submit" onclick="uploadStaticWeb()">업로드</button>
            </div>
        </div>

        <div id="static-web-done-view" style="display:none">
            <div class="login-body">
                <div class="login-message">
                    등록되었습니다.<br />
                    <a id="static-web-link" href="#" target="_blank" rel="noopener"></a>
                </div>
            </div>
            <div class="login-footer">
                <button class="login-btn" onclick="closeStaticWebModal()">확인</button>
            </div>
        </div>
    </div>
</div>

</th:block>
</body>
</html>
