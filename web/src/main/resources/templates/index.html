<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>

<div layout:fragment="content">

<!-- ── Hero ── -->
<section class="hero">
  <div class="hero-content">
    <p class="hero-eyebrow"><th:block th:each="tag, stat : ${content['tags']}"><th:block th:text="${tag}"/> <th:block th:unless="${stat.last}">· </th:block></th:block></p>
    <h1 class="hero-title" th:text="${content['title']}"></h1>
    <p class="hero-subtitle" th:text="${content['description']}"></p>
    <a href="/architecture" class="hero-cta">
      About Architecture
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
  <a href="#content" class="scroll-hint">
    <div class="scroll-line"></div>
    Scroll
  </a>
</section>

<!-- ── Posts ── -->
<section id="content">
  <div class="container-wide">

    <div class="section-divider">
      <span id="pageInfoTop">Latest Posts</span>
    </div>

    <div class="content-layout">

      <!-- ── Main: Post List ── -->
      <div class="content-main">
        <div class="post-list" id="postList">
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
        </div>

      </div><!-- /content-main -->

      <!-- ── Sidebar ── -->
      <th:block th:replace="~{fragments/post-sidebar :: post-sidebar}"></th:block>

    </div><!-- /content-layout -->
  </div>
</section>

</div><!-- /layout:fragment content -->

<th:block layout:fragment="scripts">
<script src="/js/post-list-shared.js"></script>
<script th:inline="none">
  document.addEventListener('DOMContentLoaded', () => {
    const hero = document.querySelector('.hero');
    if (hero) {
      hero.style.background = `
      linear-gradient(to bottom, rgba(26,23,20,0.62) 0%, rgba(26,23,20,0.3) 60%, rgba(26,23,20,0.72) 100%),
      url('/image/bg-picture-blog.jpg') center/cover no-repeat
    `;
    }
    loadPosts();
  });

  function loadPosts() {
    fetch('/api/post/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(res => res.json())
    .then(result => {
      if (result.success && result.data) {
        renderPosts(result.data.content);
        renderPagination(result.data.page, result.data.totalPages);
        updatePageInfo(result.data.page, result.data.totalPages);
      } else {
        document.getElementById('postList').innerHTML =
          '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">게시글이 없습니다.</p>';
      }
    })
    .catch(err => {
      console.error('게시글 로드 실패:', err);
      document.getElementById('postList').innerHTML =
        '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">게시글을 불러오지 못했습니다.</p>';
    });
  }

  function renderPosts(posts) {
    const postList = document.getElementById('postList');
    if (!posts || posts.length === 0) {
      postList.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">게시글이 없습니다.</p>';
      return;
    }

    postList.innerHTML = posts.map(post => {
      const tagsHtml = (post.tags || []).map(tag =>
        '<a href="/post-list/1?tag=' + encodeURIComponent(tag) + '" class="tag">' + escapeHtml(tag) + '</a>'
      ).join('');

      const date = post.publishedAt
        ? new Date(post.publishedAt).toISOString().substring(0, 10)
        : (post.createdAt ? new Date(post.createdAt).toISOString().substring(0, 10) : '');

      const writerName = post.writerName || 'walter.hwang';
      const writerImg  = post.writerProfileImage || 'https://i.pravatar.cc/40?img=11';
      const summary    = post.summary || '';

      return `
        <article class="post-item">
          ${tagsHtml ? '<div class="post-tags">' + tagsHtml + '</div>' : ''}
          <a href="/post/${post.postSeq}" class="post-title">${escapeHtml(post.title)}</a>
          ${summary ? '<p class="post-excerpt">' + escapeHtml(summary) + '</p>' : ''}
          <div class="post-meta">
            <img src="${writerImg}" alt="profile" class="post-author-img" />
            <span class="post-author-name">${escapeHtml(writerName)}</span>
            <span class="post-date">${date}</span>
            <span class="post-view-count">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px;">
                <rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/>
              </svg>
              ${(post.viewCount || 0).toLocaleString()}
            </span>
          </div>
          <a href="/post/${post.postSeq}" class="post-read-more">Read</a>
        </article>
      `;
    }).join('');

    // 포스트 애니메이션 적용 (shared observer 사용)
    document.querySelectorAll('.post-item').forEach(el => postItemObserver.observe(el));
  }

  function renderPagination(currentPg, totalPages) {
    const pagination = document.getElementById('pagination');
    if (totalPages <= 1) {
      pagination.innerHTML = '';
      return;
    }

    let html = '';

    if (currentPg > 1) {
      html += `<a href="${buildPageUrl(currentPg - 1)}" class="page-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Newer Posts
      </a>`;
    }

    html += '<span class="page-info">Page ' + currentPg + ' of ' + totalPages + '</span>';

    if (currentPg < totalPages) {
      html += `<a href="${buildPageUrl(currentPg + 1)}" class="page-link">
        Older Posts
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>`;
    }

    pagination.innerHTML = html;
  }

  function updatePageInfo(currentPg, totalPages) {
    const info = document.getElementById('pageInfoTop');
    if (info) info.textContent = 'Latest Posts · Page ' + currentPg + ' of ' + totalPages;
  }

  function buildPageUrl(page) {
    return '/post-list/' + page;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>
</th:block>

</body>
</html>
