<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>

<div layout:fragment="content">

<!-- ── Hero ── -->
<section class="hero">
  <div class="hero-content">
    <p class="hero-eyebrow"><th:block th:each="tag, stat : ${content['tags']}"><th:block th:text="${tag}"/> <th:block th:unless="${stat.last}">· </th:block></th:block></p>
    <h1 class="hero-title" th:text="${content['title']}"></h1>
    <p class="hero-subtitle" th:text="${content['description']}"></p>
    <a href="/#" class="hero-cta">
      About Architecture
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
  <a href="#content" class="scroll-hint">
    <div class="scroll-line"></div>
    Scroll
  </a>
</section>

<!-- ── Posts ── -->
<section id="content">
  <div class="container-wide">

    <div class="section-divider">
      <span id="pageInfoTop">Latest Posts</span>
    </div>

    <div class="content-layout">

      <!-- ── Main: Post List ── -->
      <div class="content-main">
        <div class="post-list" id="postList">
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
        </div>

      </div><!-- /content-main -->

      <!-- ── Sidebar ── -->
      <aside class="content-sidebar">

        <!-- Search -->
        <div class="sidebar-search-card">
          <form action="/" method="get" class="sidebar-search-form" onsubmit="return handleSearch(event)">
            <input type="text" id="searchInput" name="keyword" class="sidebar-search-input" placeholder="Search posts..." autocomplete="off" />
            <button type="submit" class="sidebar-search-btn" aria-label="검색">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
              </svg>
            </button>
          </form>
        </div>

        <!-- Category Tree -->
        <div class="cat-tree-card" id="catTreeCard">
          <div class="cat-tree-header" onclick="toggleCatTree()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Categories
            <span class="cat-tree-toggle">▼</span>
          </div>
          <div class="cat-tree-body" id="catTreeBody">
          </div>
        </div><!-- /cat-tree-card -->

      </aside><!-- /content-sidebar -->

    </div><!-- /content-layout -->
  </div>
</section>

</div><!-- /layout:fragment content -->

<th:block layout:fragment="scripts">
<script th:inline="none">
  document.addEventListener('DOMContentLoaded', () => {
    const hero = document.querySelector('.hero');
    if (hero) {
      hero.style.background = `
      linear-gradient(to bottom, rgba(26,23,20,0.62) 0%, rgba(26,23,20,0.3) 60%, rgba(26,23,20,0.72) 100%),
      url('/image/bg-picture-blog.jpg') center/cover no-repeat
    `;
    }
    loadPosts();
  });

  function loadPosts() {
    fetch('/api/post/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(res => res.json())
    .then(result => {
      if (result.success && result.data) {
        renderPosts(result.data.content);
        renderPagination(result.data.page, result.data.totalPages);
        updatePageInfo(result.data.page, result.data.totalPages);
      } else {
        document.getElementById('postList').innerHTML =
          '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">게시글이 없습니다.</p>';
      }
    })
    .catch(err => {
      console.error('게시글 로드 실패:', err);
      document.getElementById('postList').innerHTML =
        '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">게시글을 불러오지 못했습니다.</p>';
    });
  }

  function renderPosts(posts) {
    const postList = document.getElementById('postList');
    if (!posts || posts.length === 0) {
      postList.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">게시글이 없습니다.</p>';
      return;
    }

    postList.innerHTML = posts.map(post => {
      const tagsHtml = (post.tags || []).map(tag =>
        '<span class="tag">' + escapeHtml(tag) + '</span>'
      ).join('');

      const date = post.publishedAt
        ? new Date(post.publishedAt).toISOString().substring(0, 10)
        : (post.createdAt ? new Date(post.createdAt).toISOString().substring(0, 10) : '');

      const writerName = post.writerName || 'walter.hwang';
      const writerImg = post.writerProfileImage || 'https://i.pravatar.cc/40?img=11';
      const summary = post.summary || '';

      return `
        <article class="post-item">
          ${tagsHtml ? '<div class="post-tags">' + tagsHtml + '</div>' : ''}
          <a href="/post/${post.postSeq}" class="post-title">${escapeHtml(post.title)}</a>
          ${summary ? '<p class="post-excerpt">' + escapeHtml(summary) + '</p>' : ''}
          <div class="post-meta">
            <img src="${writerImg}" alt="profile" class="post-author-img" />
            <span class="post-author-name">${escapeHtml(writerName)}</span>
            <span class="post-date">${date}</span>
          </div>
          <a href="/post/${post.postSeq}" class="post-read-more">Read</a>
        </article>
      `;
    }).join('');

    // 포스트 애니메이션 적용
    document.querySelectorAll('.post-item').forEach(el => observer.observe(el));
  }

  function renderPagination(currentPg, totalPages) {
    const pagination = document.getElementById('pagination');
    if (totalPages <= 1) {
      pagination.innerHTML = '';
      return;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const keyword = urlParams.get('keyword');

    let html = '';

    // 이전 페이지
    if (currentPg > 1) {
      const prevParams = buildPageUrl(currentPg - 1, keyword);
      html += `<a href="${prevParams}" class="page-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Newer Posts
      </a>`;
    }

    html += '<span class="page-info">Page ' + currentPg + ' of ' + totalPages + '</span>';

    // 다음 페이지
    if (currentPg < totalPages) {
      const nextParams = buildPageUrl(currentPg + 1, keyword);
      html += `<a href="${nextParams}" class="page-link">
        Older Posts
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>`;
    }

    pagination.innerHTML = html;
  }

  function updatePageInfo(currentPg, totalPages) {
    const info = document.getElementById('pageInfoTop');
    if (info) {
      info.textContent = 'Latest Posts · Page ' + currentPg + ' of ' + totalPages;
    }
  }

  function buildPageUrl(page, keyword) {
    const params = new URLSearchParams();
    if (page > 1) params.set('page', page);
    if (keyword) params.set('keyword', keyword);
    const qs = params.toString();
    return qs ? '/?' + qs : '/';
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.post-item').forEach(el => observer.observe(el));

  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 80) {
      nav.style.borderBottomColor = 'rgba(255,255,255,0.12)';
    } else {
      nav.style.borderBottomColor = 'rgba(255,255,255,0.07)';
    }
  });

  document.querySelectorAll('a[href="#content"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('content').scrollIntoView({ behavior: 'smooth' });
    });
  });

  function toggleNode(id) {
    const btn      = document.querySelector(`#node-${id} > .cat-node-row .cat-expand-btn`);
    const children = document.getElementById('children-' + id);
    if (!btn || !children) return;
    const isOpen = children.classList.contains('open');
    children.classList.toggle('open', !isOpen);
    btn.classList.toggle('open', !isOpen);
  }

  function toggleCatTree() {
    document.getElementById('catTreeCard').classList.toggle('collapsed');
  }

  // 카테고리 트리 렌더링
  function renderCatTree(categories, parentEl, depth) {
    categories.forEach(function(cat) {
      const hasChildren = cat.children && cat.children.length > 0;
      const node = document.createElement('div');
      node.className = 'cat-node cat-lv' + depth;
      if (hasChildren) node.id = 'node-' + cat.slug;

      let rowHtml = '<div class="cat-node-row">';
      for (let i = 1; i < depth; i++) rowHtml += '<div class="cat-indent-line"></div>';
      if (hasChildren) {
        rowHtml += '<button class="cat-expand-btn open" onclick="toggleNode(\'' + cat.slug + '\')" aria-label="펼치기">'
            + '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>'
            + '</button>';
      } else {
        rowHtml += '<div class="cat-leaf-spacer"></div>';
      }
      const icon = hasChildren ? '📁' : '📄';
      rowHtml += '<a href="/post-list/1?categorySeq=' + cat.categorySeq + '" class="cat-link">'
          + '<span class="cat-link-icon">' + icon + '</span>'
          + '<span class="cat-link-name">' + cat.categoryName + '</span>'
          + '</a>';
      rowHtml += '</div>';
      node.innerHTML = rowHtml;

      if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'cat-children open';
        childrenDiv.id = 'children-' + cat.slug;
        renderCatTree(cat.children, childrenDiv, depth + 1);
        node.appendChild(childrenDiv);
      }
      parentEl.appendChild(node);
    });
  }

  // API 호출로 카테고리 트리 로드
  fetch('/api/post/category/tree')
      .then(res => res.json())
      .then(result => {
        const catTreeBody = document.getElementById('catTreeBody');
        if (catTreeBody && result.data && result.data.length > 0) {
          renderCatTree(result.data, catTreeBody, 1);
        }
      })
      .catch(err => console.error('카테고리 트리 로드 실패:', err));

  function handleSearch(e) {
    e.preventDefault();
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) return false;
    window.location.href = '/?keyword=' + encodeURIComponent(keyword);
    return false;
  }
</script>
</th:block>

</body>
</html>
