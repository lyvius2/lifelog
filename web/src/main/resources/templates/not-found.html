<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <title>Page Not Found — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>

<th:block th:replace="~{fragments/navigation :: nav}"></th:block>

<div style="flex:1">
    <div class="access-denied-wrap">
        <div class="access-denied-icon">🔍</div>
        <div class="access-denied-title">존재하지 않는 주소입니다.</div>
        <div class="access-denied-message">요청하신 페이지를 찾을 수 없습니다.</div>
        <div class="access-denied-timer">
            <span id="countdown" class="countdown">5</span><span>초 후 기본 화면으로 이동합니다.</span>
        </div>
        <a href="/index" class="access-denied-link">지금 바로 이동</a>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/modals :: modals}"></th:block>

    <script>
        (function () {
            let seconds = 5;
            const el = document.getElementById('countdown');
            const timer = setInterval(function () {
                seconds--;
                el.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    location.href = '/index';
                }
            }, 1000);
        })();
    </script>

<th:block th:replace="~{fragments/common-scripts :: scripts}"></th:block>

</body>
</html>
