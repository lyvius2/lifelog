<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Photos — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body class="photos-page">

<div layout:fragment="content">

  <!-- ── Page Header ── -->
  <div class="page-header">
    <div class="header-bg-strip">
      <div class="header-strip-inner" id="stripInner">
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&q=70')"></div>
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=70')"></div>
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1536782376847-5c9d14d97cc0?w=400&q=70')"></div>
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1501854140801-50d01698950b?w=400&q=70')"></div>
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&q=70')"></div>
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&q=70')"></div>
        <div class="strip-img" style="background-image:url('https://images.unsplash.com/photo-1434725039720-aaad6dd32dfe?w=400&q=70')"></div>
      </div>
      <div class="header-overlay"></div>
    </div>
    <div class="header-text">
      <p class="header-eyebrow" th:text="'風雨来記\'s Gallery · ' + ${period.minYear} + ' – ' + ${period.maxYear}"></p>
      <h1 class="header-title">Photos</h1>
      <p class="header-sub">여행과 일상 속에서 담은 순간들</p>
    </div>
  </div>

  <!-- ── Gallery Controls ── -->
  <div class="gallery-controls">
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" data-category-seq="">All</button>
      <button class="filter-btn" th:each="cat : ${categories}"
              th:data-filter="${cat.name}"
              th:data-category-seq="${cat.categorySeq}"
              th:text="${cat.name}">Category</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="btnMasonry" title="Masonry view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="10"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="15" width="7" height="6"/><rect x="14" y="12" width="7" height="9"/>
        </svg>
      </button>
      <button class="view-btn" id="btnGrid" title="Grid view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Gallery ── -->
  <div class="gallery-wrap">
    <div class="gallery-grid masonry" id="galleryGrid">
      <!-- SSR: 첫 페이지 사진 렌더링 -->
      <div class="photo-card" th:each="photo, iterStat : ${archive.content}"
           th:data-index="${iterStat.index}"
           th:data-photo-seq="${photo.photoSeq}"
           th:data-src="'/photo' + ${photo.src}"
           th:data-thumb="'/photo' + ${photo.thumb}"
           th:data-title="${photo.title}"
           th:data-caption="${photo.caption}"
           th:data-category-seq="${photo.categorySeq}"
           th:data-category-name="${photo.categoryName}"
           th:data-likes="${photo.likes}"
           th:data-shot-at="${photo.shotAt}"
           th:data-created-at="${photo.createdAt}"
           th:data-user-seq="${photo.userSeq}"
           th:data-photographer-name="${photo.photographerName}"
           th:data-photographer-profile-image="${photo.photographerProfileImage}"
           th:data-photographer-email="${photo.photographerEmail}"
           th:data-tags="${photo.tags}"
           th:data-exif-maker="${photo.exif?.maker}"
           th:data-exif-model="${photo.exif?.model}"
           th:data-exif-aperture="${photo.exif?.aperture}"
           th:data-exif-shutter="${photo.exif?.shutter}"
           th:data-exif-iso="${photo.exif?.iso}"
           th:data-exif-focal="${photo.exif?.focal}"
           th:data-exif-lens="${photo.exif?.lens}">
        <img th:src="${photo.thumb != null ? '/photo' + photo.thumb : '/photo' + photo.src}"
             th:alt="${photo.title}"
             loading="lazy" />
        <div class="photo-overlay">
          <div class="overlay-stats">
            <div class="overlay-stat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1.5">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span th:text="${photo.likes}">0</span>
            </div>
            <!-- 댓글 수 (추후 구현 예정)
            <div class="overlay-stat">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              0
            </div>
            -->
          </div>
          <div class="overlay-tag" th:if="${photo.tags != null and !photo.tags.isEmpty()}"
               th:text="${photo.tags[0]}"></div>
        </div>
      </div>
    </div><!-- /gallery-grid -->

    <div class="load-more-wrap">
      <button class="load-more-btn" id="loadMoreBtn"
              th:text="${archive.page >= archive.totalPages ? 'All Photos Loaded' : 'Load More Photos'}"
              th:disabled="${archive.page >= archive.totalPages}"
              th:style="${archive.page >= archive.totalPages ? 'opacity:0.4' : ''}">Load More Photos</button>
    </div>
  </div>

  <!-- ── Lightbox ── -->
  <div class="lightbox" id="lightbox">
    <div class="lb-backdrop" id="lbBackdrop"></div>
    <div class="lb-inner">
      <button class="lb-close" id="lbClose">✕</button>
      <button class="lb-nav-btn lb-prev" id="lbPrev">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="lb-nav-btn lb-next" id="lbNext">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="lb-img-wrap">
        <div class="lb-loading" id="lbLoading">
          <div class="lb-spinner"></div>
        </div>
        <img id="lbImg" src="" alt="" />
      </div>
      <div class="lb-sidebar">
        <!-- 캡션/태그: 모바일에서도 항상 보임 -->
        <div class="lb-summary">
          <div class="lb-caption-title" id="lbTitle"></div>
          <div class="lb-caption-text" id="lbText"></div>
          <div class="lb-tags" id="lbTags"></div>
        </div>

        <!-- 메타정보 토글 버튼 (모바일 전용) -->
        <button class="lb-mobile-toggle" id="lbMobileToggle">
          <span>Photo Details</span>
          <span class="toggle-arrow">▼</span>
        </button>

        <!-- 메타정보: 모바일에서 토글 대상 -->
        <div class="lb-meta-section">
          <div class="lb-author">
            <img class="lb-author-img" id="lbAuthorImg" src="https://i.pravatar.cc/80?img=11" alt="author" />
            <div>
              <div class="lb-author-name" id="lbAuthorName"></div>
              <div class="lb-author-handle" id="lbAuthorEmail"></div>
            </div>
          </div>
          <div class="lb-caption">
            <!-- EXIF / Camera Spec Panel -->
            <div class="lb-exif" id="lbExif">
              <div class="lb-exif-header" id="lbExifToggle">
                <span class="lb-exif-header-label">&#128247; Camera &amp; EXIF</span>
                <span class="lb-exif-toggle-icon">&#9660;</span>
              </div>
              <div class="lb-exif-body" id="lbExifBody">
                <div class="exif-camera-row">
                  <span class="exif-camera-icon">&#128248;</span>
                  <div>
                    <div class="exif-camera-model" id="exifModel">-</div>
                    <div class="exif-camera-maker" id="exifMaker">-</div>
                  </div>
                </div>
                <div class="exif-chip">
                  <span class="exif-chip-label">Aperture</span>
                  <span class="exif-chip-value" id="exifAperture">-</span>
                </div>
                <div class="exif-chip">
                  <span class="exif-chip-label">Shutter</span>
                  <span class="exif-chip-value" id="exifShutter">-</span>
                </div>
                <div class="exif-chip">
                  <span class="exif-chip-label">ISO</span>
                  <span class="exif-chip-value" id="exifIso">-</span>
                </div>
                <div class="exif-chip">
                  <span class="exif-chip-label">Focal Length</span>
                  <span class="exif-chip-value" id="exifFocal">-</span>
                </div>
                <div class="exif-chip lens-chip">
                  <span class="exif-chip-label">Lens</span>
                  <span class="exif-chip-value" id="exifLens">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="lb-actions">
          <button class="lb-action-btn" id="lbLike">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <span id="lbLikeCount">0</span>
          </button>
          <!-- 댓글 (추후 구현 예정)
          <button class="lb-action-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="lbCommentCount">0</span>
          </button>
          -->
          <span class="lb-date" id="lbDate"></span>
        </div>
      </div>
    </div>
  </div>

</div><!-- /layout:fragment content -->

<th:block layout:fragment="scripts">
  <script th:inline="javascript">
  // ── SSR 초기 데이터 (Thymeleaf에서 주입) ──
  window.initialPage = /*[[${archive.page}]]*/ 1;
  window.initialTotalPages = /*[[${archive.totalPages}]]*/ 1;
  </script>
  <script src="/js/photos.js"></script>
</th:block>

</body>
</html>
