<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Blog — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>

<div layout:fragment="content">
<!-- ── Posts ── -->
<section id="content">
  <div class="container-wide">

    <div class="section-divider">
      <span th:text="'Latest Posts · Page ' + ${postPage.page} + ' of ' + ${postPage.totalPages}"></span>
    </div>

    <div class="content-layout">

      <!-- ── Main: Post List ── -->
      <div class="content-main">
        <div class="post-list">

          <!-- 게시글이 없는 경우 -->
          <p th:if="${#lists.isEmpty(postPage.content)}" style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">
            게시글이 없습니다.
          </p>

          <!-- 게시글 반복 -->
          <article class="post-item" th:each="post : ${postPage.content}">
            <div class="post-tags" th:if="${post.tags != null and !post.tags.isEmpty()}">
              <span class="tag" th:each="tag : ${post.tags}" th:text="${tag}">Tag</span>
            </div>
            <a th:href="@{'/post/' + ${post.postSeq}}" class="post-title" th:text="${post.title}">
              게시글 제목
            </a>
            <p class="post-excerpt" th:if="${post.summary != null}" th:text="${post.summary}">
              게시글 요약
            </p>
            <div class="post-meta">
              <img src="https://i.pravatar.cc/40?img=11" alt="profile" class="post-author-img" />
              <span class="post-author-name" th:text="${post.writerName ?: 'walter.hwang'}">walter.hwang</span>
              <span class="post-date" th:text="${post.publishedAt != null ? #temporals.format(post.publishedAt, 'yyyy-MM-dd') : (post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd') : '')}">2022-09-04</span>
            </div>
            <a th:href="@{'/post/' + ${post.postSeq}}" class="post-read-more">Read</a>
          </article>

        </div><!-- /post-list -->

        <!-- Pagination -->
        <div class="pagination" th:if="${postPage.totalPages > 1}">
          <!-- 이전 페이지 -->
          <a th:if="${postPage.page > 1}"
             th:href="@{'/post-list/' + ${postPage.page - 1}}"
             class="page-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Newer Posts
          </a>

          <span class="page-info" th:text="'Page ' + ${postPage.page} + ' of ' + ${postPage.totalPages}">Page 1 of 3</span>

          <!-- 다음 페이지 -->
          <a th:if="${postPage.page < postPage.totalPages}"
             th:href="@{'/post-list/' + ${postPage.page + 1}}"
             class="page-link">
            Older Posts
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>

      </div><!-- /content-main -->

      <!-- ── Sidebar ── -->
      <aside class="content-sidebar">

        <!-- Search -->
        <div class="sidebar-search-card">
          <form action="/" method="get" class="sidebar-search-form" onsubmit="return handleSearch(event)">
            <input type="text" id="searchInput" name="keyword" class="sidebar-search-input" placeholder="Search posts..." autocomplete="off" />
            <button type="submit" class="sidebar-search-btn" aria-label="검색">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
              </svg>
            </button>
          </form>
        </div>

        <!-- Category Tree -->
        <div class="cat-tree-card" id="catTreeCard">
          <div class="cat-tree-header" onclick="toggleCatTree()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Categories
            <span class="cat-tree-toggle">▼</span>
          </div>
          <div class="cat-tree-body" id="catTreeBody">
            <!-- JavaScript로 동적 생성 -->
          </div>
        </div><!-- /cat-tree-card -->

      </aside><!-- /content-sidebar -->

    </div><!-- /content-layout -->
  </div>
</section>

</div><!-- /layout:fragment content -->

<th:block layout:fragment="scripts">
<script th:inline="none">
  const urlParams = new URLSearchParams(window.location.search);
  const currentCategorySeq = urlParams.get('categorySeq') ? parseInt(urlParams.get('categorySeq')) : null;

  document.addEventListener('DOMContentLoaded', () => {
    const hero = document.querySelector('.hero');
    if (hero) {
      hero.style.background = `
      linear-gradient(to bottom, rgba(26,23,20,0.62) 0%, rgba(26,23,20,0.3) 60%, rgba(26,23,20,0.72) 100%),
      url('https://images.unsplash.com/photo-1518770660439-4636190af475?w=1600&q=80') center/cover no-repeat
    `;
    }
  });

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('visible'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.post-item').forEach(el => observer.observe(el));

  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 80) {
      nav.style.borderBottomColor = 'rgba(255,255,255,0.12)';
    } else {
      nav.style.borderBottomColor = 'rgba(255,255,255,0.07)';
    }
  });

  document.querySelectorAll('a[href="#content"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById('content').scrollIntoView({ behavior: 'smooth' });
    });
  });

  function toggleNode(id) {
    const btn      = document.querySelector(`#node-${id} > .cat-node-row .cat-expand-btn`);
    const children = document.getElementById('children-' + id);
    if (!btn || !children) return;
    const isOpen = children.classList.contains('open');
    children.classList.toggle('open', !isOpen);
    btn.classList.toggle('open', !isOpen);
  }

  function toggleCatTree() {
    document.getElementById('catTreeCard').classList.toggle('collapsed');
  }

  // 카테고리 트리 렌더링
  function renderCatTree(categories, parentEl, depth) {
    categories.forEach(function(cat) {
      const hasChildren = cat.children && cat.children.length > 0;
      const node = document.createElement('div');
      node.className = 'cat-node cat-lv' + depth;
      if (hasChildren) node.id = 'node-' + cat.slug;

      let rowHtml = '<div class="cat-node-row">';
      for (let i = 1; i < depth; i++) rowHtml += '<div class="cat-indent-line"></div>';
      if (hasChildren) {
        rowHtml += '<button class="cat-expand-btn" onclick="toggleNode(\'' + cat.slug + '\')" aria-label="펼치기">'
            + '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>'
            + '</button>';
      } else {
        rowHtml += '<div class="cat-leaf-spacer"></div>';
      }
      const icon = hasChildren ? '📁' : '📄';
      const isActive = (cat.categorySeq === currentCategorySeq) ? ' active' : '';
      rowHtml += '<a href="/post-list/1?categorySeq=' + cat.categorySeq + '" class="cat-link' + isActive + '">'
          + '<span class="cat-link-icon">' + icon + '</span>'
          + '<span class="cat-link-name">' + cat.categoryName + '</span>'
          + '</a>';
      rowHtml += '</div>';
      node.innerHTML = rowHtml;

      if (hasChildren) {
        const childrenDiv = document.createElement('div');
        childrenDiv.className = 'cat-children';
        childrenDiv.id = 'children-' + cat.slug;
        renderCatTree(cat.children, childrenDiv, depth + 1);
        node.appendChild(childrenDiv);
      }
      parentEl.appendChild(node);
    });
  }

  // API 호출로 카테고리 트리 로드
  fetch('/api/post/category/tree')
      .then(res => res.json())
      .then(result => {
        const catTreeBody = document.getElementById('catTreeBody');
        if (catTreeBody && result.data && result.data.length > 0) {
          renderCatTree(result.data, catTreeBody, 1);
        }
      })
      .catch(err => console.error('카테고리 트리 로드 실패:', err));

  function handleSearch(e) {
    e.preventDefault();
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) return false;
    window.location.href = '/post-list/1?keyword=' + encodeURIComponent(keyword);
    return false;
  }
</script>
</th:block>

</body>
</html>
