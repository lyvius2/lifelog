<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Blog — Lifelog</title>
    <link rel="stylesheet" href="/css/lifelog.css" />
</head>
<body>

<div layout:fragment="content">
<!-- ── Posts ── -->
<section id="content">
  <div class="container-wide">

    <div class="section-divider">
      <span th:text="'Latest Posts · Page ' + ${postPage.page} + ' of ' + ${postPage.totalPages}"></span>
    </div>

    <div class="content-layout">

      <!-- ── Main: Post List ── -->
      <div class="content-main">
        <div class="post-list">

          <!-- 게시글이 없는 경우 -->
          <p th:if="${#lists.isEmpty(postPage.content)}" style="text-align:center;color:rgba(255,255,255,0.5);padding:60px 0;">
            게시글이 없습니다.
          </p>

          <!-- 게시글 반복 -->
          <article class="post-item" th:each="post : ${postPage.content}">
            <div class="post-tags" th:if="${post.tags != null and !post.tags.isEmpty()}">
              <a th:each="tag : ${post.tags}" th:href="@{/post-list/1(tag=${tag})}"
                 th:classappend="${searchTag != null and tag == searchTag} ? ' tag-active' : ''"
                 class="tag" th:text="${tag}">Tag</a>
            </div>
            <a th:href="@{'/post/' + ${post.postSeq}}" class="post-title" th:text="${post.title}">
              게시글 제목
            </a>
            <p class="post-excerpt" th:if="${post.summary != null}" th:text="${post.summary}">
              게시글 요약
            </p>
            <div class="post-meta">
              <img th:src="${post.writerProfileImage != null ? post.writerProfileImage : 'https://i.pravatar.cc/40?img=11'}" alt="profile" class="post-author-img" />
              <span class="post-author-name" th:text="${post.writerName ?: 'walter.hwang'}">walter.hwang</span>
              <span class="post-date" th:text="${post.publishedAt != null ? #temporals.format(post.publishedAt, 'yyyy-MM-dd') : (post.createdAt != null ? #temporals.format(post.createdAt, 'yyyy-MM-dd') : '')}">2022-09-04</span>
              <span class="post-view-count">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: -2px;">
                  <rect x="18" y="3" width="4" height="18"/><rect x="10" y="8" width="4" height="13"/><rect x="2" y="13" width="4" height="8"/>
                </svg>
                <span th:text="${post.viewCount}">0</span>
              </span>
            </div>
            <a th:href="@{'/post/' + ${post.postSeq}}" class="post-read-more">Read</a>
          </article>

        </div><!-- /post-list -->

        <!-- Pagination -->
        <div class="pagination" th:if="${postPage.totalPages > 1}">
          <!-- 이전 페이지 -->
          <a th:if="${postPage.page > 1}"
             th:href="@{'/post-list/' + ${postPage.page - 1}}"
             class="page-link page-nav">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Newer Posts
          </a>

          <span class="page-info" th:text="'Page ' + ${postPage.page} + ' of ' + ${postPage.totalPages}">Page 1 of 3</span>

          <!-- 다음 페이지 -->
          <a th:if="${postPage.page < postPage.totalPages}"
             th:href="@{'/post-list/' + ${postPage.page + 1}}"
             class="page-link page-nav">
            Older Posts
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>

      </div><!-- /content-main -->

      <!-- ── Sidebar ── -->
      <th:block th:replace="~{fragments/post-sidebar :: post-sidebar}"></th:block>

    </div><!-- /content-layout -->
  </div>
</section>

</div><!-- /layout:fragment content -->

<th:block layout:fragment="scripts">
<script src="/js/post-list-shared.js"></script>
</th:block>
</body>
</html>
