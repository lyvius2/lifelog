<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${post.content.title} + ' — Lifelog'"></title>
    <link rel="stylesheet" href="/css/post.css" />
</head>
<body>

<div layout:fragment="content">

<div id="progress-bar"></div>

<!-- ── Post Hero ── -->
<div class="post-hero">
    <div class="post-hero-inner">
        <div class="post-breadcrumb">
            <a href="/">Blog</a>
            <span class="post-breadcrumb-sep">/</span>
            <span th:if="${post.content.categoryName}" th:text="${post.content.categoryName}">Category</span>
            <span th:if="${post.content.categoryName}" class="post-breadcrumb-sep">/</span>
            <span class="post-breadcrumb-current" th:text="${post.content.title}">게시글 제목</span>
        </div>

        <div class="post-tags-hero" th:if="${post.content.tags != null and !post.content.tags.isEmpty()}">
            <span class="post-tag-pill" th:each="tag : ${post.content.tags}" th:text="${tag}">Tag</span>
        </div>

        <h1 class="post-title" th:text="${post.content.title}">게시글 제목</h1>

        <div class="post-meta-bar">
        <span class="post-meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span th:text="${post.content.publishedAt != null} ? ${#temporals.format(post.content.publishedAt, 'yyyy. MM. dd')} : ${#temporals.format(post.content.createdAt, 'yyyy. MM. dd')}">2022. 05. 28</span>
        </span>
            <div class="post-meta-divider"></div>
            <span class="post-meta-item">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span th:text="${post.author.name}">walter.hwang</span>
        </span>
            <div class="post-meta-divider"></div>
            <span class="post-read-time">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span th:text="${post.content.viewCount} + ' views'">0 views</span>
        </span>
        </div>
    </div>
</div>

<!-- ── Body + Sidebar ── -->
<div class="post-layout">

    <!-- Article -->
    <article class="post-body" id="post-content" th:utext="${post.content.content}">
        <p>게시글 본문 내용이 여기에 표시됩니다.</p>
    </article>

    <!-- Sidebar -->
    <aside class="post-sidebar">

        <!-- Post Info -->
        <div class="post-info-card">
            <div class="post-info-row">
                <span class="post-info-label">Date</span>
                <span class="post-info-value" th:text="${post.content.publishedAt != null} ? ${#temporals.format(post.content.publishedAt, 'yyyy. MM. dd')} : ${#temporals.format(post.content.createdAt, 'yyyy. MM. dd')}">2022. 05. 28</span>
            </div>
            <div class="post-info-row">
                <span class="post-info-label">Author</span>
                <span class="post-info-value" th:text="${post.author.name}">walter.hwang</span>
            </div>
            <div class="post-info-row" th:if="${post.content.tags != null and !post.content.tags.isEmpty()}">
                <span class="post-info-label">Tags</span>
                <span class="post-info-value">
                    <span class="post-info-tag" th:each="tag : ${post.content.tags}" th:text="${tag}">Tag</span>
                </span>
            </div>
        </div>

        <!-- TOC -->
        <div class="toc-card">
            <div class="toc-header">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                Table of Contents
            </div>
            <ul class="toc-list" id="toc-list">
                <!-- JavaScript로 동적 생성 -->
            </ul>
        </div>

        <!-- Category Tree -->
        <div class="cat-tree-card" id="catTreeCard">
            <div class="cat-tree-header" onclick="toggleCatTree()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
                Categories
                <span class="cat-tree-toggle">▼</span>
            </div>
            <div class="cat-tree-body" id="catTreeBody">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div><!-- /cat-tree-card -->

        <!-- Share -->
        <div>
            <div class="share-label">Share this post</div>
            <div class="share-btns">
                <a class="share-btn" id="share-twitter" href="#" target="_blank">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.74l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    Twitter
                </a>
                <a class="share-btn" id="share-facebook" href="#" target="_blank">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </a>
            </div>
        </div>

    </aside>
</div>

<!-- ── Author ── -->
<div class="author-section">
    <div class="author-divider">
        <div class="author-divider-line"></div>
        <div class="author-divider-label">Written by</div>
        <div class="author-divider-line"></div>
    </div>

    <div class="author-card">
        <div class="author-avatar">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div class="author-info">
            <div class="author-name" th:text="${post.author.name}"></div>
            <div class="author-handle" th:text="${post.author.email}"></div>
            <p class="author-bio" th:text="${post.author.bio}"></p>
            <div class="author-links">
                <a th:href="${post.author.githubUrl}" target="_blank" class="author-link">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
                    GitHub
                </a>
                <a th:href="${post.author.linkedinUrl}" target="_blank" class="author-link">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                    LinkedIn
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ── Pagination ── -->
<div class="post-pagination">
    <a th:if="${post.prevContent != null}" th:href="'/post/' + ${post.prevContent.postSeq}" class="pag-item prev">
        <div class="pag-dir">← Previous</div>
        <div class="pag-title" th:text="${post.prevContent.title}">이전 게시글</div>
    </a>
    <div th:if="${post.prevContent == null}" class="pag-item prev empty"></div>

    <a th:if="${post.nextContent != null}" th:href="'/post/' + ${post.nextContent.postSeq}" class="pag-item next">
        <div class="pag-dir">Next →</div>
        <div class="pag-title" th:text="${post.nextContent.title}">다음 게시글</div>
    </a>
    <div th:if="${post.nextContent == null}" class="pag-item next empty"></div>
</div>

</div><!-- /layout:fragment content -->

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    const currentCategorySeq = /*[[${post.content.categorySeq}]]*/ null;
</script>
<script>
    // 카테고리 트리 렌더링
    function renderCatTree(categories, parentEl, depth) {
        categories.forEach(function(cat) {
            const hasChildren = cat.children && cat.children.length > 0;
            const node = document.createElement('div');
            node.className = 'cat-node cat-lv' + depth;
            if (hasChildren) node.id = 'node-' + cat.slug;

            let rowHtml = '<div class="cat-node-row">';
            for (let i = 1; i < depth; i++) rowHtml += '<div class="cat-indent-line"></div>';
            if (hasChildren) {
                rowHtml += '<button class="cat-expand-btn" onclick="toggleNode(\'' + cat.slug + '\')" aria-label="펼치기">'
                    + '<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg>'
                    + '</button>';
            } else {
                rowHtml += '<div class="cat-leaf-spacer"></div>';
            }
            const isActive = (cat.categorySeq === currentCategorySeq) ? ' active' : '';
            const icon = hasChildren ? '📁' : '📄';
            rowHtml += '<a href="#" class="cat-link' + isActive + '">'
                + '<span class="cat-link-icon">' + icon + '</span>'
                + '<span class="cat-link-name">' + cat.categoryName + '</span>'
                + '</a>';
            rowHtml += '</div>';
            node.innerHTML = rowHtml;

            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'cat-children';
                childrenDiv.id = 'children-' + cat.slug;
                renderCatTree(cat.children, childrenDiv, depth + 1);
                node.appendChild(childrenDiv);
            }
            parentEl.appendChild(node);
        });
    }

    // API 호출로 카테고리 트리 로드
    fetch('/api/category/tree')
        .then(res => res.json())
        .then(result => {
            const catTreeBody = document.getElementById('catTreeBody');
            if (catTreeBody && result.data && result.data.length > 0) {
                renderCatTree(result.data, catTreeBody, 1);
            }
        })
        .catch(err => console.error('카테고리 트리 로드 실패:', err));

    const bar = document.getElementById('progress-bar');
    window.addEventListener('scroll', () => {
        const doc = document.documentElement;
        const scrollTop = window.scrollY;
        const scrollHeight = doc.scrollHeight - doc.clientHeight;
        bar.style.width = (scrollTop / scrollHeight * 100) + '%';
    }, { passive: true });

    // TOC 동적 생성
    const tocListEl = document.getElementById('toc-list');
    const headings = document.querySelectorAll('#post-content h5[id]');
    headings.forEach(h => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.className = 'toc-link';
        a.textContent = h.textContent;
        li.appendChild(a);
        tocListEl.appendChild(li);
    });

    const tocLinks = document.querySelectorAll('.toc-link');
    const tocObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                tocLinks.forEach(l => l.classList.remove('active'));
                const active = document.querySelector(`.toc-link[href="#${entry.target.id}"]`);
                if (active) active.classList.add('active');
            }
        });
    }, { rootMargin: '-20% 0px -70% 0px' });
    headings.forEach(h => tocObserver.observe(h));

    function copyCode(btn) {
        const pre = btn.closest('.code-wrap').querySelector('pre');
        navigator.clipboard.writeText(pre.innerText).then(() => {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    function toggleNode(id) {
        const btn      = document.querySelector(`#node-${id} > .cat-node-row .cat-expand-btn`);
        const children = document.getElementById('children-' + id);
        if (!btn || !children) return;
        const isOpen = children.classList.contains('open');
        children.classList.toggle('open', !isOpen);
        btn.classList.toggle('open', !isOpen);
    }

    function toggleCatTree() {
        document.getElementById('catTreeCard').classList.toggle('collapsed');
    }

    // Share 버튼 URL 동적 설정
    const currentUrl = encodeURIComponent(window.location.href);
    const pageTitle = encodeURIComponent(document.querySelector('.post-title')?.textContent || document.title);
    const twitterBtn = document.getElementById('share-twitter');
    const facebookBtn = document.getElementById('share-facebook');
    if (twitterBtn) twitterBtn.href = `https://twitter.com/share?text=${pageTitle}&url=${currentUrl}`;
    if (facebookBtn) facebookBtn.href = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;
</script>
</th:block>

</body>
</html>
